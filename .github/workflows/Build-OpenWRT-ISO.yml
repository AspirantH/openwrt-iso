name: Build-ImmortalWRT-ISO

on:
  workflow_dispatch:
    inputs:
      alpine_version:
        description: 'Alpine 版本'
        required: false
        default: '3.20'
      image_url:
        description: 'img.gz 文件直链（以.img.gz 结尾）'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker
        run: |
          # 清理已有Docker安装
          sudo apt-get remove -y docker docker-engine docker.io containerd runc 2>/dev/null || true
          sudo apt-get autoremove -y

          # 安装必要依赖
          sudo apt-get update
          sudo apt-get install -y \
              ca-certificates \
              curl \
              gnupg \
              lsb-release

          # 添加Docker官方GPG密钥
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg

          # 设置仓库
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
            $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          # 安装Docker
          sudo apt-get update
          sudo apt-get install -y \
              docker-ce \
              docker-ce-cli \
              containerd.io \
              docker-compose-plugin

          # 启动服务
          sudo systemctl start docker
          sudo systemctl enable docker

          # 验证
          docker --version
          echo "✅ Docker安装成功"

      - name: Download OpenWRT image
        id: download
        run: |
          mkdir -p assets output
          chmod 777 output

          IMAGE_URL="${{ github.event.inputs.image_url }}"
          echo "使用手工提供的链接: $IMAGE_URL"

          # 检查链接是否以 .img.gz 结尾
          if [[ ! "$IMAGE_URL" =~ \.img\.gz$ ]]; then
              echo "❌ 错误: 提供的链接不是以 .img.gz 结尾"
              exit 1
          fi

          # 提取文件名（URL最后一部分）
          FILENAME_GZ=$(basename "$IMAGE_URL")
          # 下载到 assets/ 下，保持原始文件名
          echo "下载文件: $FILENAME_GZ"
          wget -q "$IMAGE_URL" -O "assets/$FILENAME_GZ" || curl -L -o "assets/$FILENAME_GZ" --retry 3 "$IMAGE_URL"
          if [ $? -ne 0 ]; then
              echo "❌ 下载失败"
              exit 1
          fi

          # 解压（自动删除 .gz 后缀，得到 .img 文件）
          echo "解压中..."
          gzip -d "assets/$FILENAME_GZ"
          # 解压后的文件路径（去掉 .gz）
          IMG_PATH="assets/${FILENAME_GZ%.gz}"

          # 检查最终镜像是否存在
          if [ ! -f "$IMG_PATH" ]; then
              echo "❌ 错误: 解压后的镜像文件 $IMG_PATH 不存在"
              exit 1
          fi
          echo "镜像路径: $IMG_PATH"
          echo "镜像大小: $(stat -c%s "$IMG_PATH" | numfmt --to=iec)"

          # 将路径设为步骤输出
          echo "IMG_PATH=$IMG_PATH" >> $GITHUB_OUTPUT

      - name: Generate timestamp for release
        id: timestamp
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=manual-$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=手动构建 $TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Build ISO
        uses: sirpdboy/openwrt-installer-iso@main
        with:
          INPUT_IMG: "${{ steps.download.outputs.IMG_PATH }}"
          OUTPUT_DIR: "./output"
          OUTPUT_ISO_NAME: "immortalwrt-installer.iso"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.timestamp.outputs.RELEASE_TAG }}
          name: ${{ steps.timestamp.outputs.RELEASE_NAME }}
          body: |
            # EzOpWrt 安装器

            ## 构建信息
            - 构建时间: ${{ steps.timestamp.outputs.TIMESTAMP }}
            - Alpine 版本: ${{ github.event.inputs.alpine_version }}
            - 镜像来源: ${{ github.event.inputs.image_url }}
            - 提交: ${{ github.sha }}
          files: output/*.iso
          prerelease: false  # 可以根据需要改为 true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
