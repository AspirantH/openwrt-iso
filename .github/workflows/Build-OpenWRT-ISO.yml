name: Build-OpenWRT-ISO

on:
  workflow_dispatch:
    inputs:
      alpine_version:
        description: 'Alpine 版本（用于构建环境，不影响镜像）'
        required: false
        default: '3.20'
      image_url:
        description: 'OpenWRT img.gz 文件直链（必填，建议以 .img.gz 结尾）'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker
        run: |
          # 清理已有Docker安装
          sudo apt-get remove -y docker docker-engine docker.io containerd runc 2>/dev/null || true
          sudo apt-get autoremove -y

          # 安装必要依赖
          sudo apt-get update
          sudo apt-get install -y \
              ca-certificates \
              curl \
              gnupg \
              lsb-release \
              file  # 添加 file 命令用于检测文件类型

          # 添加Docker官方GPG密钥
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg

          # 设置仓库
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
            $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          # 安装Docker
          sudo apt-get update
          sudo apt-get install -y \
              docker-ce \
              docker-ce-cli \
              containerd.io \
              docker-compose-plugin

          # 启动服务
          sudo systemctl start docker
          sudo systemctl enable docker

          docker --version
          echo "✅ Docker安装成功"

      - name: Download OpenWRT image
        id: download
        run: |
          mkdir -p assets output
          chmod 777 output

          IMAGE_URL="${{ github.event.inputs.image_url }}"
          echo "使用提供的链接: $IMAGE_URL"

          # 提取文件名（URL最后一部分）
          FILENAME_GZ=$(basename "$IMAGE_URL")
          DOWNLOAD_PATH="assets/$FILENAME_GZ"

          # 下载文件
          echo "下载文件: $FILENAME_GZ"
          wget -q "$IMAGE_URL" -O "$DOWNLOAD_PATH" || curl -L -o "$DOWNLOAD_PATH" --retry 3 "$IMAGE_URL"
          if [ $? -ne 0 ]; then
              echo "❌ 下载失败"
              exit 1
          fi

          # 检查文件大小（防止下载错误页面）
          FILE_SIZE=$(stat -c%s "$DOWNLOAD_PATH")
          echo "下载文件大小: $FILE_SIZE 字节 ($(numfmt --to=iec $FILE_SIZE))"
          if [ $FILE_SIZE -lt 1048576 ]; then  # 小于1MB可能有问题
              echo "⚠️ 警告: 文件小于1MB，可能不是有效的镜像文件"
          fi

          # 检测文件类型
          FILE_TYPE=$(file -b "$DOWNLOAD_PATH")
          echo "文件类型: $FILE_TYPE"

          # 判断是否为 gzip 压缩
          if file "$DOWNLOAD_PATH" | grep -q "gzip compressed"; then
              echo "检测到 gzip 压缩格式，正在解压..."
              gzip -d "$DOWNLOAD_PATH"
              IMG_PATH="assets/${FILENAME_GZ%.gz}"
              echo "解压完成: $IMG_PATH"
          else
              echo "文件不是 gzip 压缩格式，直接作为镜像使用"
              IMG_PATH="$DOWNLOAD_PATH"
          fi

          # 检查最终镜像是否存在
          if [ ! -f "$IMG_PATH" ]; then
              echo "❌ 错误: 镜像文件 $IMG_PATH 不存在"
              exit 1
          fi

          FINAL_SIZE=$(stat -c%s "$IMG_PATH")
          echo "最终镜像路径: $IMG_PATH"
          echo "最终镜像大小: $(numfmt --to=iec $FINAL_SIZE)"

          # 输出路径供后续步骤使用
          echo "IMG_PATH=$IMG_PATH" >> $GITHUB_OUTPUT

      - name: Generate timestamp for release
        id: timestamp
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=manual-$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=手动构建 $TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Build ISO
        uses: learnscode/openwrt-installer-iso@main
        with:
          INPUT_IMG: "${{ steps.download.outputs.IMG_PATH }}"
          OUTPUT_DIR: "./output"
          OUTPUT_ISO_NAME: "immortalwrt-installer.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-installer
          path: output/*.iso
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.timestamp.outputs.RELEASE_TAG }}
          name: ${{ steps.timestamp.outputs.RELEASE_NAME }}
          body: |

            ## 构建信息
            - 构建时间: ${{ steps.timestamp.outputs.TIMESTAMP }}
            - Alpine 版本: ${{ github.event.inputs.alpine_version }}
            - 镜像来源: ${{ github.event.inputs.image_url }}
            - 提交: ${{ github.sha }}
          files: output/*.iso
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
